apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkinslab
  namespace: jenkinslab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkinslab

  template:
    metadata:
      labels:
        app: jenkinslab

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: jenkinslab
          image: romeo2296/jenkinslab:6f79dd785df4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi